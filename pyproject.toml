[project]
name = "minimal-coding-agent"
version = "0.1.0"
description = "Minimal coding agent: real LLM tool calls, per-task Docker sandbox, web UI"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.128.8", "uvicorn==0.39.0", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["docker: requires real Linux Docker engine and prebuilt sandbox image"]
